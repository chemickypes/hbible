# Project-wide Gradle settings.
# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Enables Gradle Build Cache.
org.gradle.caching=true
# Enables Gradle Configuration Cache, the preferred Gradle execution mode.
org.gradle.configuration-cache=true
# AndroidX package structure (required by AndroidX libraries).
android.useAndroidX=true
# Kotlin code style: "official" or "obsolete".
kotlin.code.style=official
# Each library's R class includes only resources declared in the library itself.
android.nonTransitiveRClass=true
# AGP 9: `com.android.application` in un modulo KMP (con org.jetbrains.kotlin.multiplatform)
# richiede il vecchio comportamento (built-in Kotlin disattivato). Escape hatch documentato
# dal messaggio d'errore AGP; non esiste `com.android.kotlin.multiplatform.application`.
android.builtInKotlin=false
android.newDsl=false

